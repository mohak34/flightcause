[project]
name = "volatus"
version = "0.1.0"
description = "Ask questions about PX4 drone flight logs and get cited answers."
readme = "README.md"
authors = [
    { name = "mohak34", email = "mohaks0408@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pyulog>=1.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
volatus = "volatus:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B905", "SIM905"]
